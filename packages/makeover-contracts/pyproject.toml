[project]
name = "makeover-contracts"
version = "0.1.0"
description = "Versioned data contracts shared by makeover-discovery and makeover-render."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makeover_contracts"]

[project.scripts]
makeover-contracts-export = "makeover_contracts.schema_export:main"
