# Phase 0 shape. Postgres, Redis, and the render service join in later phases.
services:
  discovery:
    build: .
    ports:
      - "8080:8080"
    environment:
      MAKEOVER_ENVIRONMENT: local
      MAKEOVER_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
